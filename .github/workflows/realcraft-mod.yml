name: RealCraft mod

on:
  push:
    paths:
      - "minecraft/realcraft-realism/**"
      - ".github/workflows/realcraft-mod.yml"
  pull_request:
    paths:
      - "minecraft/realcraft-realism/**"
      - ".github/workflows/realcraft-mod.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/realcraft-realism

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: realcraft-realism-1.20.1
          path: minecraft/realcraft-realism/build/libs/*.jar

      # Boots a dedicated server to "Done": proves the common mixins apply and that the
      # biome modifiers, feature, tags and damage type load while the spawn area generates.
      # (Client-only mixins are not exercised here; they need an in-game test.)
      - name: Boot dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 1200 ./gradlew runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 200); do
            if grep -q "Done (" server.log; then break; fi
            if grep -q "BUILD FAILED\|Crash report saved\|Failed to start the minecraft server" server.log; then break; fi
            sleep 5
          done
          pkill -f runServer || true
          pkill -f "forge_server\|forgeserver\|net.minecraftforge.bootstrap" || true
          if ! grep -q "Done (" server.log; then
            tail -n 300 server.log
            exit 1
          fi
          if grep -E "FAILED during APPLY|was not applied|Mixin apply .* failed|Exception in server tick loop" server.log; then
            exit 1
          fi
          echo "Server booted cleanly."

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-log
          path: minecraft/realcraft-realism/server.log
          if-no-files-found: ignore
